name: CI

on:
  push:
    branches: [main, refactoring]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps needed by the code paths under test (no open3d/GUI needed
          # for the packet/CRC/transform tests, but pointcloud tests import it).
          pip install numpy scipy pyserial open3d opencv-python-headless pye57 pytest ruff

      - name: Lint with ruff
        run: ruff check lib tests

      - name: Run tests
        run: pytest tests/ -v