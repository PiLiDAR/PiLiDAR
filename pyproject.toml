[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilidar"
version = "2.5.0"
description = "Open-source, low-cost DIY 360° LiDAR scanner and panoramic 3D reconstruction system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.10",
    "plotly>=6.0",
    "pyserial>=3.5",
    "scipy>=1.15",
    "open3d>=0.20",
    "opencv-python>=5.0",
    "pye57>=0.4.12",
    "pymeshlab>=2025.7",
    "quat>=1.0.0",
    "mpu6050>=0.0.3",
]

[project.optional-dependencies]
pi-hardware = [
    "lgpio>=0.2.2",
    # picamera2 ships with Raspberry Pi OS (libcamera); not pip-installable
]
dev = [
    "jupyter",  # development & visualization only, not needed for production scans
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "E722",  # bare except used intentionally in lib/*/import fallback blocks
]
